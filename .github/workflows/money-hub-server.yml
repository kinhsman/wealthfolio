name: money-hub server

# Tests and builds the Wealthfolio server (Rust) of a money-hub/v* branch for the owner's arm64
# box, and publishes the binary on the `money-hub-server` release as server-<commit>, where the
# money-hub repo's server/deploy-server.sh picks it up. Runs only when server code changes.
# Not a Wealthfolio release.

on:
  push:
    branches: ["money-hub/v*", "server-*"]
    paths:
      - "crates/**"
      - "apps/server/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Dockerfile"
      - ".github/workflows/money-hub-server.yml"

permissions:
  contents: write

concurrency:
  group: money-hub-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: money-hub
      - name: Format
        run: cargo fmt -p wealthfolio-ai -p wealthfolio-agent-tools -- --check
      - name: Test the assistant and its tools
        run: |
          cargo test --locked -p wealthfolio-agent-tools
          cargo test --locked -p wealthfolio-ai --features test-utils

  build:
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Add a stage holding only the server binary
        run: |
          cp Dockerfile Dockerfile.money-hub
          printf '\nFROM scratch AS server-only\nCOPY --from=backend /wealthfolio-server /wealthfolio-server\n' >> Dockerfile.money-hub
      - name: Build the server like the official image does (arm64, musl)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.money-hub
          target: server-only
          platforms: linux/arm64
          outputs: type=local,dest=out
      - name: Publish server-<commit>
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SHA=$(git rev-parse --short=12 HEAD)
          cp out/wealthfolio-server "server-$SHA"
          file "server-$SHA"
          sha256sum "server-$SHA" | cut -d' ' -f1 > "server-$SHA.sha256"
          gh release view money-hub-server >/dev/null 2>&1 || gh release create money-hub-server --prerelease \
            --target "${GITHUB_REF_NAME}" --title "money-hub server builds" \
            --notes "Built Wealthfolio servers (arm64) of the money-hub/v* branch for the owner's box (money-hub repo, server/deploy-server.sh). Not a Wealthfolio release."
          gh release upload money-hub-server "server-$SHA" "server-$SHA.sha256" --clobber
          # Keep the last 5 builds.
          gh release view money-hub-server --json assets -q '.assets | sort_by(.createdAt) | reverse | map(select(.name | endswith(".sha256") | not)) | .[5:][] | .name' |
            while read -r old; do gh release delete-asset money-hub-server "$old" -y; gh release delete-asset money-hub-server "$old.sha256" -y || true; done
          echo "published server-$SHA"
